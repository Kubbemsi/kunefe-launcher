        header {

            justify-content: space-between;

        .hamburger-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger-btn.open span:nth-child(2) { opacity: 0; }
        .hamburger-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* DRAWER MENÜ */

        .drawer-overlay.open { opacity: 1; pointer-events: all; }
        .drawer { position: fixed; top: 0; right: 0; width: 75%; max-width: 280px; height: 100%; background: #111007; border-left: 2px solid #ca8a04; z-index: 100; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; padding: 30px 0; }
        .drawer.open { transform: translateX(0); }
        .drawer-header { display: flex; align-items: center; gap: 12px; padding: 0 24px 24px 24px; border-bottom: 1px solid rgba(202,138,4,0.2); margin-bottom: 16px; }
        .drawer-logo { width: 40px; height: 40px; background: linear-gradient(135deg, #fef08a, #facc15); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #422006; }
        .drawer-title { font-size: 15px; font-weight: 900; color: #facc15; }
        .drawer-subtitle { font-size: 10px; color: #9ca3af; font-weight: 700; }
        .drawer-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 0 12px; }
        .drawer-nav a { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; text-decoration: none; color: #d1d5db; font-weight: 800; font-size: 13px; transition: all 0.2s ease; }

        .drawer-nav a .nav-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(255,255,255,0.05); }

        .drawer-dropdown {

            flex-direction: column;
            border-radius: 12px;
            transition: all 0.25s ease;

        .drawer-dropdown.open {

            border: 1px solid rgba(202, 138, 4, 0.3);
        }
        .drawer-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #d1d5db;
            font-weight: 800;
            font-size: 13px;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            user-select: none;
        }
        .drawer-dropdown-toggle:active {
            background: rgba(202, 138, 4, 0.12);
            color: #facc15;
        }
        .drawer-dropdown.open .drawer-dropdown-toggle {
            color: #facc15;
        }
        .drawer-dropdown-toggle .nav-icon {
            width: 36px; height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .drawer-dropdown.open .drawer-dropdown-toggle .nav-icon {
            background: rgba(202, 138, 4, 0.25);
            color: #facc15;
        }
        .drawer-dropdown-toggle svg { fill: currentColor; }
        .drawer-arrow {

            font-size: 10px;
            color: #ca8a04;

        .drawer-submenu {

            flex-direction: column;

        .auth-form { display: flex; flex-direction: column; gap: 14px; }

        .form-group label { font-size: 11px; font-weight: 800; color: #facc15; letter-spacing: 0.5px; }
        .form-group input {

        .submit-btn {

            color: #422006;
            border: none;
            padding: 13px 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 900;

            margin-top: 4px;

        .error-msg {

        /* PROFİL EKRANI */

            border-radius: 10px;

            font-weight: 900;
            cursor: pointer;

        .hidden { display: none !important; }
    </style>
</head>

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawerOverlay');
            const btn = document.getElementById('hamburgerBtn');
            if (drawer.classList.contains('open')) { closeDrawer(); }
            else {
                drawer.classList.add('open');
                overlay.classList.add('open');
                btn.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
        }
        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawerOverlay').classList.remove('open');
            document.getElementById('hamburgerBtn').classList.remove('open');
            document.body.style.overflow = '';
        }
    </script>

    <!-- FIREBASE İŞLEMLERİ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDI7kmxlLRKpcRLp9J-HNYyq4wFBIia1w",
            authDomain: "kunefesmp.firebaseapp.com",
            projectId: "kunefesmp",
            storageBucket: "kunefesmp.firebasestorage.app",
            messagingSenderId: "394720158469",
            appId: "1:394720158469:web:f933b340d23c3846f5cd6c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const authFormsWrapper = document.getElementById('auth-forms-wrapper');
        const profileWrapper = document.getElementById('profile-wrapper');
        const errorBox = document.getElementById('error-box');
        const tabLoginBtn = document.getElementById('tab-login-btn');
        const tabRegisterBtn = document.getElementById('tab-register-btn');
        const logoutBtn = document.getElementById('logout-btn');

        tabLoginBtn.addEventListener('click', () => switchTab('login'));
        tabRegisterBtn.addEventListener('click', () => switchTab('register'));

        function switchTab(tab) {
            showError('');
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabLoginBtn.classList.remove('active');
                tabRegisterBtn.classList.add('active');
            }
        }

        function showError(msg) {
            if (msg) {
                errorBox.innerText = msg;
                errorBox.style.display = 'block';
            } else {
                errorBox.style.display = 'none';
            }
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showError('');

            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordRepeat = document.getElementById('reg-password-repeat').value;

            if (password !== passwordRepeat) {
                showError("Şifreler birbiriyle eşleşmiyor!");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await updateProfile(user, { displayName: username });
                await setDoc(doc(db, "users", user.uid), {
                    username: username,
                    email: email,
                    createdAt: new Date().toISOString()
                });

                localStorage.setItem('kunefeUser', username);

            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    showError('Bu e-posta adresi zaten kullanımda.');
                } else if (error.code === 'auth/weak-password') {
                    showError('Şifre en az 6 karakter olmalıdır.');
                } else if (error.code === 'auth/invalid-email') {
                    showError('Geçersiz bir e-posta formatı girdiniz.');
                } else {
                    showError('Kayıt oluşturulurken bir hata oluştu: ' + error.message);
                }
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showError('');

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    showError('E-posta veya şifre hatalı!');
                } else {
                    showError('Giriş yapılırken bir hata oluştu.');
                }
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            localStorage.removeItem('kunefeUser');
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authFormsWrapper.classList.add('hidden');
                profileWrapper.classList.remove('hidden');

                let username = user.displayName;
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        username = userDoc.data().username || username;
                    }
                } catch (e) {
                    console.error("Kullanıcı verisi çekilemedi:", e);
                }

                const displayName = username || 'Oyuncu';
                localStorage.setItem('kunefeUser', displayName);

                document.getElementById('user-name').innerText = displayName;
                document.getElementById('user-email-text').innerText = user.email;
                document.getElementById('user-avatar').src = `https://mc-heads.net/avatar/${displayName}/100`;

            } else {
                authFormsWrapper.classList.remove('hidden');
                profileWrapper.classList.add('hidden');
                localStorage.removeItem('kunefeUser');
            }
        });
    </script>
</body>
