# ==============================================================================
#                       KÜNEFESMP - KÜNEFEKOMUT AYARLARI
# ==============================================================================

# Mesaj ön eki
prefix: "&6&l[KünefeKomut]&r "

# Varsayılan spam koruması (saniye cinsinden)
cooldown-default-seconds: 1

# Sağ tıklayınca ses efekti çalsın mı?
play-sound: true
sound-name: "UI_BUTTON_CLICK"
sound-volume: 1.0
sound-pitch: 1.2

# ==============================================================================
#                      OTOMATİK SPAWN EŞYALARI VE BÖLGE AYARLARI
# ==============================================================================
spawn-system:
  enabled: true
  world: "spawn"
  # Sadece spawn dünyasında olmayı yeterli saymak için true yapabilirsiniz.
  # false olursa aşağıdaki koordinat sınırları (bounding box) kontrol edilir.
  only-check-world: false
  region:
    min-x: -150.0
    max-x: 160.0
    min-y: -10.0
    max-y: 120.0
    min-z: 400.0
    max-z: 710.0

  # Spawnda oyuncunun normal dünyadaki tüm envanterini (zırh, sol el ve eşyaları)
  # güvenle yedekleyip gizlesin mi? Spawndan çıkınca tüm eşyalar, zırhlar ve sol eldeki eşya
  # eksiksiz geri yüklenir!
  separate-inventory: true

  # Spawnda oyuncuları otomatik Macera (Adventure) moduna alsın mı?
  # Spawndan çıkınca otomatik Hayatta Kalma (Survival) moduna geri döner.
  # (OP/Yetkili olanların oyun modu bozulmaz!)
  adventure-mode: true

  # Spawnda tuzak kapıları (trapdoors), kapılar, çit kapıları, butonlar, şalterler
  # ve tabelalara yazı yazma/düzenleme engellensin mi?
  protect-interactions: true

  # Ana Spawnda oyunculara otomatik dağıtılacak hotbar eşyaları:
  # (Spawna girince verilir, spawndan çıkınca çantadan otomatik silinir.
  #  Yere atılamaz, sandığa konulamaz, çanta içinde yeri değiştirilemez, ölünce düşmez!)
  items:

    # 1. Hotbar Yuvası (Slot 0): Sunucu Menüsü
    menu:
      slot: 0
      material: COMPASS
      glow: true
      name: "&6&lSUNUCU MENÜSÜ &7(Sağ Tıkla)"
      lore:
        - "&7Sunucumuzdaki tüm sistemlere,"
        - "&7warplara ve özelliklere tek tıkla ulaş!"
        - ""
        - "&e► Menüyü açmak için sağ tıkla!"
      command: "menu"
      is-console: false
      cooldown: 1

    # 2. Hotbar Yuvası (Slot 1): Vahşi Doğa (RTP)
    rtp:
      slot: 1
      material: ENDER_PEARL
      glow: false
      name: "&a&lVAHŞİ DOĞA / RTP &7(Sağ Tıkla)"
      lore:
        - "&7Rastgele ışınlanma menüsünü açar;"
        - "&7Dünya, Nether ve End seçenekleri sunar."
        - ""
        - "&a► RTP menüsünü açmak için sağ tıkla!"
      command: "menu rtp"
      is-console: false
      cooldown: 1

    # 3. Hotbar Yuvası (Slot 2): Sunucu Marketi
    market:
      slot: 2
      material: CHEST
      glow: false
      name: "&e&lSUNUCU MARKETİ &7(Sağ Tıkla)"
      lore:
        - "&7Bloklar, tarım ve maden ürünlerini"
        - "&7satın alabileceğin marketi açar."
        - ""
        - "&e► Marketi açmak için sağ tıkla!"
      command: "shop"
      is-console: false
      cooldown: 1

    # 5. Hotbar Yuvası (Slot 4 - Ortada): Savaş Arenası
    arena:
      slot: 4
      material: DIAMOND_SWORD
      glow: true
      name: "&c&lSAVAŞ ARENASI &7(Sağ Tıkla)"
      lore:
        - "&7PvP arenasına ışınlanarak diğer"
        - "&7oyuncularla savaşa katıl!"
        - ""
        - "&c► Arenaya gitmek için sağ tıkla!"
      command: "warp arena"
      is-console: false
      cooldown: 2

    # 7. Hotbar Yuvası (Slot 6): Parkur
    parkur:
      slot: 6
      material: SLIME_BLOCK
      glow: false
      name: "&b&lPARKUR ALANI &7(Sağ Tıkla)"
      lore:
        - "&7Ödüllü parkur etabına ışınlan"
        - "&7ve yeteneklerini göster!"
        - ""
        - "&b► Parkura gitmek için sağ tıkla!"
      command: "warp parkur"
      is-console: false
      cooldown: 2

    # 8. Hotbar Yuvası (Slot 7): Discord Topluluğumuz
    discord:
      slot: 7
      material: AMETHYST_SHARD
      glow: true
      name: "&9&lDISCORD TOPLULUĞUMUZ &7(Sağ Tıkla)"
      lore:
        - "&7Discord sunucumuza katıl,"
        - "&7çekilişler ve duyurulardan haberdar ol!"
        - ""
        - "&9► Tıklayarak Discord bağlantısını al!"
      command: "discord"
      is-console: false
      cooldown: 2

    # 9. Hotbar Yuvası (Slot 8): Kişisel Ayarlar
    ayarlar:
      slot: 8
      material: COMPARATOR
      glow: false
      name: "&7&lKİŞİSEL AYARLAR &7(Sağ Tıkla)"
      lore:
        - "&7Işınlanma, özel mesaj ve oyun"
        - "&7tercihlerini özelleştir."
        - ""
        - "&7► Tıklayarak ayarları aç!"
      command: "ayarlar"
      is-console: false
      cooldown: 1

# Eşyaya komut eklendiğinde altına yazılacak açıklama biçimi
lore-format:
  player: "&7► Sağ tıklandığında: &e/{cmd}"
  console: "&7► Sağ tıklandığında: &6/{cmd} &8(Özel)"
  single-use: "&c⚠ Tek kullanımlıktır (Kullanılınca kaybolur)"
  spawn-only: "&6✦ Sadece Spawn Bölgesinde Çalışır"
  cooldown: "&8⏱ Bekleme Süresi: &7{seconds} sn"

# Mesajlar
messages:
  no-permission: "&cBu komutu kullanmak için yetkin yok!"
  no-item: "&c[!] Elinde herhangi bir eşya tutmuyorsun!"
  command-added-player: "&a[✔] Eşyaya oyuncu komutu bağlandı: &e/{cmd}"
  command-added-console: "&a[✔] Eşyaya KONSOL komutu bağlandı: &6/{cmd}"
  command-removed: "&c[✔] Eşyadaki komut ve açıklamalar temizlendi."
  single-use-on: "&e[✔] Eşya artık &cTEK KULLANIMLIK &e(kullanılınca silinir)."
  single-use-off: "&e[✔] Eşya artık &aSÜREKLİ KULLANILABİLİR&e."
  cooldown-set: "&a[✔] Eşyanın bekleme süresi &e{seconds} &asaniye olarak ayarlandı."
  name-set: "&a[✔] Eşya ismi güncellendi!"
  lore-added: "&a[✔] Eşyaya açıklama satırı eklendi!"
  lore-cleared: "&e[✔] Eşyanın açıklamaları temizlendi."
  cooldown-wait: "&cTekrar kullanmak için lütfen &e{seconds} &csaniye bekle!"
  spawn-only-error: "&c[!] Bu eşyayı yalnızca spawn bölgesinde kullanabilirsin!"
  reload: "&aKünefeKomut ayarları ve spawn eşyaları yenilendi!"
