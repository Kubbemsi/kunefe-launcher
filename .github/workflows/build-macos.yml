name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
    paths:
      - 'launcher.py'
      - 'kunefe.png'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:   # Manuel tetikleme butonu

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # ── 1. Kodu indir ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python kur ──────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. Bağımlılıkları kur ──────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller customtkinter minecraft-launcher-lib psutil pillow

      # ── 4. create-dmg kur (Homebrew) ───────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      # ── 5. PyInstaller ile .app oluştur ────────────────────────────
      - name: Build macOS .app with PyInstaller
        run: |
          pyinstaller \
            --name "KunefeLauncher" \
            --onedir \
            --windowed \
            --icon kunefe.png \
            --add-data "kunefe.png:." \
            --hidden-import customtkinter \
            --hidden-import PIL \
            --hidden-import psutil \
            --collect-all customtkinter \
            launcher.py

      # ── 6. .app imzalama atlama (ad-hoc) ───────────────────────────
      - name: Ad-hoc code sign the .app
        run: |
          codesign --force --deep --sign - dist/KunefeLauncher.app

      # ── 7. DMG oluştur ─────────────────────────────────────────────
      - name: Create DMG
        run: |
          create-dmg \
            --volname "KunefeSMP Launcher" \
            --volicon "kunefe.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "KunefeLauncher.app" 175 190 \
            --hide-extension "KunefeLauncher.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            "KunefeLauncher.dmg" \
            "dist/KunefeLauncher.app"

      # ── 8. Mimari doğrulama (hangi CPU'lar destekleniyor?) ─────────
      - name: Mimari doğrulama
        run: |
          echo "=== Runner ==="
          sw_vers
          uname -m
          echo "=== Python ==="
          python -c "import platform; print(platform.machine())"
          echo "=== Uygulama binary mimarisi ==="
          file dist/KunefeLauncher.app/Contents/MacOS/KunefeLauncher
          echo "=== lipo ==="
          lipo -archs dist/KunefeLauncher.app/Contents/MacOS/KunefeLauncher || true
          echo "=== Imza ==="
          codesign -dv dist/KunefeLauncher.app 2>&1 | head -5
          echo "=== DMG ==="
          ls -lh KunefeLauncher.dmg

      # ── 9. DMG'yi artifact olarak yükle ────────────────────────────
      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KunefeLauncher-macOS
          path: KunefeLauncher.dmg
          retention-days: 30

      # ── 9. (Opsiyonel) Sunucuya otomatik deploy ────────────────────
      # Eğer GitHub Secrets'a SSH key eklediysen bu adım çalışır.
      # Şu an devre dışı (if: false) — etkinleştirmek için false'u sil.
      - name: Deploy to server via SCP
        if: false
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 132.145.255.254
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "KunefeLauncher.dmg"
          target: "/var/www/html/kunefesmp/docs/downloads/"
