app-id: com.kunefesmp.Launcher
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: kunefe-launcher

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-data/kunefesmp:create
  - --env=JAVA_HOME=/app/jre
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin

build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'

modules:
  # 1. OpenJDK 21 (Minecraft için SDK eklentisinden çekilir)
  - name: openjdk
    buildsystem: simple
    build-commands:
      - mkdir -p /app/jre
      - cp -r /usr/lib/sdk/openjdk21/jvm/openjdk-21/* /app/jre/
    sources: []

  # 2. Python Kütüphaneleri (customtkinter, minecraft-launcher-lib, psutil, pillow, requests)
  - name: python-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-cache-dir customtkinter minecraft-launcher-lib psutil pillow requests
    sources: []

  # 3. KunefeSMP Launcher Uygulaması
  - name: kunefe-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 launcher.py /app/bin/launcher.py
      - install -Dm755 flatpak/kunefe-launcher.sh /app/bin/kunefe-launcher
      - install -Dm644 flatpak/com.kunefesmp.Launcher.desktop /app/share/applications/com.kunefesmp.Launcher.desktop
      - install -Dm644 flatpak/com.kunefesmp.Launcher.metainfo.xml /app/share/metainfo/com.kunefesmp.Launcher.metainfo.xml
      - install -Dm644 flatpak/com.kunefesmp.Launcher.png /app/share/icons/hicolor/256x256/apps/com.kunefesmp.Launcher.png
      - |
        if [ -d resourcepacks ]; then
          mkdir -p /app/share/kunefesmp/resourcepacks
          cp -r resourcepacks/* /app/share/kunefesmp/resourcepacks/
        fi
      - |
        if [ -d skins ]; then
          mkdir -p /app/share/kunefesmp/skins
          cp -r skins/* /app/share/kunefesmp/skins/
        fi
    sources:
      - type: dir
        path: ..
