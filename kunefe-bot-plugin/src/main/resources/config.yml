# ==============================================================================
#                       KÜNEFESMP - KÜNEFEBOT AYARLARI
# ==============================================================================

# Mesajların başında görünecek ön ek (prefix)
prefix: "&6&l[KünefeBot]&r "

# Oyuncuların soru sorma aralığı (saniye cinsinden cooldown)
cooldown-seconds: 3

# Cevap geldiğinde ses çalsın mı?
play-sound: true
sound-name: "ENTITY_EXPERIENCE_ORB_PICKUP"
sound-volume: 1.0
sound-pitch: 1.4

# ==============================================================================
#                              YAPAY ZEKA (AI) AYARLARI
# ==============================================================================
ai:
  enabled: true
  provider: "gemini"
  gemini:
    api-key: ""
    model: "gemini-1.5-flash"
  openai:
    api-key: ""
    model: "gpt-4o-mini"
    endpoint: "https://api.openai.com/v1/chat/completions"
  timeout-seconds: 6
  system-prompt: |
    Sen KünefeSMP adındaki Minecraft hayatta kalma (Survival/SMP) sunucusunun akıllı, eğlenceli ve yardımsever oyun içi botu 'KünefeBot'sun.
    Sunucumuzda Windows/Linux/macOS/Android için KunefeLauncher, 103 Fabric modu + 13 shader, /sat, /shop, /ah, /order, /kp_ana_menu, /kp_spawner, /ev, /sethome, /isinlan, /ayarlar, /rutbeler, /kit, /tamir, /masa, /besle, /ec mevcuttur.
    Oyuncuların sorularını Türkçe, çok kısa (en fazla 2 kısa cümle), samimi ve renkli Minecraft renk kodları (&6, &e, &a, &b, &f, &7 vb.) ile yanıtla.

# ==============================================================================
#                               MESAJLAR
# ==============================================================================
messages:
  cooldown: "&cTekrar soru sormadan önce &e{seconds} &csaniye beklemelisin!"
  no-permission: "&cBu komutu kullanmak için yetkin yok!"
  thinking: "&eSorunun cevabını düşünüyorum... &7(Lütfen bekle)"
  unknown-fallback: "&cÜzgünüm, bu soru için doğrudan bir yanıt bulamadım! &7Sorunu başka kelimelerle sorabilir veya &e/yardim &7yazabilirsin. Yetkili desteği için: &b/discord"
  reload-success: "&aKünefeBot ayarları ve soru-cevap veritabanı başarıyla yenilendi!"

