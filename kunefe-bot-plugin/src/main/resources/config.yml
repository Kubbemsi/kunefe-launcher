# ==============================================================================
#                       KÜNEFESMP - KÜNEFEBOT AYARLARI
# ==============================================================================

prefix: "&6&l[KünefeBot]&r "
cooldown-seconds: 3

play-sound: true
sound-name: "ENTITY_EXPERIENCE_ORB_PICKUP"
sound-volume: 1.0
sound-pitch: 1.4

chat-mention:
  enabled: true

# ==============================================================================
#                              YAPAY ZEKA (AI) AYARLARI
# ==============================================================================
ai:
  enabled: true
  provider: "ollama"
  
  ollama:
    endpoint: "http://132.145.255.254:7899/v1/chat/completions"
    model: "qwen2.5:3b"

  gemini:
    api-key: ""
    model: "gemini-1.5-flash"

  openai:
    api-key: "ollama-local"
    model: "qwen2.5:3b"
    endpoint: "http://132.145.255.254:7899/v1/chat/completions"

  timeout-seconds: 25
  system-prompt: |
    Sen KünefeSMP Minecraft Survival sunucusunun bilgili ve samimi yapay zeka asistanısın.
    Doğal ve akıcı bir Türkçe kullan.
    Asla uydurma dosya adları (.yml vb.) veya var olmayan komutlar söyleme.
    Minecraft vanilla mekaniklerini (Demircilik masası, netherite yükseltme şablonu, elmas zırh vb.) doğru anlat.
    Sunucu bilgileri:
    - Menü: /menu
    - Işınlanma: /rtp veya /rtpmenu
    - Ev: /ev veya /sethome
    - Market: /shop, /kpmarket, /kp_spawner, /ah
    - Eşya Satma: /sat
    - Kurallar: /kurallar
    - Claim YOKTUR, serbest survival.
    Yanıtın en fazla 1 veya 2 kısa cümle olsun.

messages:
  cooldown: "&cTekrar soru sormadan önce &e{seconds} &csaniye beklemelisin!"
  no-permission: "&cBu komutu kullanmak için yetkin yok!"
  thinking: "&eSorunun cevabını düşünüyorum... &7(Lütfen bekle)"
  unknown-fallback: "&cÜzgünüm, bu soru için doğrudan bir yanıt bulamadım! &7Sorunu başka kelimelerle sorabilir veya &e/yardim &7yazabilirsin. Yetkili desteği için: &b/discord"
  reload-success: "&aKünefeBot ayarları ve soru-cevap veritabanı başarıyla yenilendi!"

faq:

  menu_genel:
    keywords: ["menu", "ana menu", "pusula", "menuyu nasil acarim", "menu komutu"]
    response: "&7Ana menüyü açmak için &e/menu &7yazabilir veya elindeki &6pusulaya &7sağ tıklayabilirsin!"

  rtp_isinlanma:
    keywords: ["rtp", "isinlan", "rastgele isinlan", "dunyaya nasil giderim", "nethere nasil giderim", "ende nasil giderim"]
    response: "&7Rastgele ışınlanmak için &e/rtp &7yazabilir veya &e/rtpmenu &7ile Dünya, Nether ve End seçeneklerinden birini seçebilirsin!"

  ev_sethome:
    keywords: ["ev", "sethome", "ev nasil kaydederim", "eve nasil giderim", "evime nasil giderim"]
    response: "&7Evini kaydetmek için &e/sethome &7yaz, daha sonra istediğin zaman &e/ev &7ile evine ışınlan!"

  claim_bilgi:
    keywords: ["claim", "claim nasil atilir", "arazi", "arazi kilitleme", "claim atma"]
    response: "&cSunucumuzda claim sistemi YOKTUR! &7Klasik serbest survival deneyimi sunuyoruz, evini uzaklara yapmanı öneririz."

  market_shop:
    keywords: ["market", "shop", "esyayi nereden alirim", "alisveris", "market komutu"]
    response: "&7Sunucu marketini açmak için &e/shop &7veya &e/market &7yazabilirsin!"

  kpmarket_bilgi:
    keywords: ["kpmarket", "kp market", "kunefe puan", "puan marketi", "kp marketi"]
    response: "&7Künefe Puanı (KP) marketini açmak için &e/kpmarket &7yazabilirsin!"

  spawner_bilgi:
    keywords: ["spawner", "spawner market", "spawner nasil alinir", "kp_spawner"]
    response: "&7Spawner marketini açmak için &e/kp_spawner &7komutunu kullanabilirsin!"

  ah_pazar:
    keywords: ["ah", "pazar", "acik arttirma", "oyuncu pazari", "esya satma pazari"]
    response: "&7Oyuncuların sattığı eşyaları görmek için &e/ah &7yazabilir, elindeki eşyayı satmak için &e/ah sell <fiyat> &7kullanabilirsin!"

  sat_para:
    keywords: ["sat", "para", "para nasil kazanilir", "nasil zengin olurum", "maden sat"]
    response: "&7Elindeki veya envanterindeki eşyaları satıp para kazanmak için &e/sat &7yazabilirsin!"

  kurallar_bilgi:
    keywords: ["kurallar", "kural", "hile serbest mi", "hile yasak mi", "kufur"]
    response: "&7Sunucu kurallarını okumak için &e/kurallar &7yazabilirsin! Hile, küfür ve haksız kazanç kesinlikle yasaktır."

  discord_bilgi:
    keywords: ["discord", "dc", "dc linki", "topluluk"]
    response: "&7KünefeSMP Discord sunucumuza katılmak için: &bhttps://discord.gg/kunefesmp"
